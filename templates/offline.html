<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Conexão — AllCourts365</title>
    <link rel="icon" type="image/png" href="/static/bolinha.png">
    <meta name="theme-color" content="#0f172a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-wrap svg {
            width: 40px;
            height: 40px;
            fill: #fbbf24;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        p {
            color: #94a3b8;
            font-size: 0.98rem;
            line-height: 1.55;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #ffb347, #c43a00);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(196, 58, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(196, 58, 0, 0.45);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .brand-sub {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-3.66-11.64-3.66-2.28 0-4.32.39-6.07 1.05l2.09 2.09C9.28 6.18 10.59 6 12 6c4.54 0 7.82 2.05 8.16 2.27l3.48-4.27zm-7.6 7.6L2.81 1.39 1.39 2.81l3.37 3.37C2.7 7.21 1 8.65.36 9.17l11.63 14.49 5.34-6.65 3.86 3.86 1.41-1.41-6.56-6.86zM12 21.5l-8.6-10.7c.39-.3 2.83-2.06 6.64-2.47l8.47 8.47L12 21.5z"/>
            </svg>
        </div>
        <h1>Você está sem conexão</h1>
        <p>
            Não foi possível carregar a página porque seu dispositivo está sem internet. Suas informações e jogos continuam salvos com segurança.
        </p>
        <button type="button" class="btn-retry" onclick="window.location.reload();">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            Tentar novamente
        </button>
        <div class="brand-sub">
            AllCourts365 &bull; Gestão de Clubes, Rankings e Torneios
        </div>
    </div>
</body>
</html>
