{% extends "base.html" %}
{% load i18n %}

{% block title %}Senha Alterada - AllCourts365{% endblock %}

{% block extra_head %}
<style>
    .reset-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
    }
    .reset-card {
        width: 100%;
        max-width: 450px;
        padding: 40px;
        text-align: center;
    }
    .btn-login {
        display: inline-block;
        width: 100%;
        padding: 12px;
        background: var(--highlight-color, #00BFFF);
        color: #fff;
        text-decoration: none;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 15px;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <div class="glass-card reset-card">
        <div style="margin-bottom: 20px;">
            <i class="fas fa-check-circle" style="font-size: 3rem; color: #34d399;"></i>
        </div>
        <h2 style="font-size: 2rem; color: #fff; margin-bottom: 20px; font-weight: 800;">Senha Alterada!</h2>
        
        <p style="color: var(--subtitle-color, #ccc); margin-bottom: 30px; line-height: 1.6;">
            Sua senha foi alterada com sucesso. Você já pode fazer login com sua nova senha.
        </p>

        <a href="{% url 'account_login' %}" class="btn-login">Fazer Login</a>
    </div>
</div>
{% endblock %}
