<!-- Partial PWA In-App Browser Escape (WhatsApp, Instagram, Facebook) -->
<style>
    .pwa-inapp-banner {
        display: none;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 14px;
        padding: 14px 18px;
        margin: 12px auto 20px;
        max-width: 520px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        position: relative;
        z-index: 999;
        animation: inAppSlideDown 0.3s ease-out;
    }
    @keyframes inAppSlideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .pwa-inapp-header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 0.95rem;
        color: #fbbf24;
        margin-bottom: 6px;
    }
    .pwa-inapp-desc {
        font-size: 0.85rem;
        color: #cbd5e1;
        line-height: 1.45;
        margin-bottom: 12px;
    }
    .pwa-inapp-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .pwa-inapp-btn-primary {
        background: linear-gradient(135deg, #ffb347, #c43a00);
        color: #ffffff;
        font-weight: 700;
        font-size: 0.82rem;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .pwa-inapp-btn-sec {
        background: rgba(255, 255, 255, 0.08);
        color: #94a3b8;
        font-weight: 600;
        font-size: 0.82rem;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
    }
    .pwa-inapp-btn-sec:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.14);
    }
</style>

<div id="pwaInAppBanner" class="pwa-inapp-banner">
    <div class="pwa-inapp-header">
        <i class="fas fa-external-link-alt"></i>
        <span id="pwaInAppTitle">Abrir no Navegador Principal</span>
    </div>
    <div class="pwa-inapp-desc" id="pwaInAppDesc">
        Você está visualizando pelo navegador interno do WhatsApp/Instagram. Para ter a experiência completa e poder <strong>instalar o app na tela inicial</strong>, abra no navegador padrão do seu celular.
    </div>
    <div class="pwa-inapp-actions">
        <a id="pwaInAppOpenBtn" href="#" class="pwa-inapp-btn-primary">
            <i class="fas fa-compass"></i> Abrir no Navegador
        </a>
        <button type="button" id="pwaInAppCopyBtn" class="pwa-inapp-btn-sec">
            <i class="fas fa-copy"></i> Copiar link
        </button>
        <button type="button" id="pwaInAppDismissBtn" class="pwa-inapp-btn-sec" style="margin-left: auto;">
            Continuar aqui
        </button>
    </div>
</div>

<script>
(function() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isInApp = /WhatsApp|FBAN|FBAV|Instagram|Line|GSA|Snapchat|MicroMessenger/i.test(ua);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (!isInApp || isStandalone) {
        return;
    }

    const isAndroid = /Android/i.test(ua);
    const isIos = /iPhone|iPad|iPod/i.test(ua);
    const banner = document.getElementById('pwaInAppBanner');
    const openBtn = document.getElementById('pwaInAppOpenBtn');
    const copyBtn = document.getElementById('pwaInAppCopyBtn');
    const dismissBtn = document.getElementById('pwaInAppDismissBtn');
    const descEl = document.getElementById('pwaInAppDesc');

    if (!banner) return;

    if (sessionStorage.getItem('pwa_inapp_dismissed') === 'true') {
        return;
    }

    banner.style.display = 'block';

    const currentUrl = window.location.href;

    if (isAndroid) {
        const intentUrl = 'intent://' + window.location.host + window.location.pathname + window.location.search +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
        if (openBtn) {
            openBtn.href = intentUrl;
            openBtn.innerHTML = '<i class="fab fa-chrome"></i> Abrir no Chrome';
        }
        if (descEl) {
            descEl.innerHTML = 'Para melhor navegação e poder <strong>instalar o aplicativo na tela inicial</strong>, toque em <strong>Abrir no Chrome</strong>.';
        }
    } else if (isIos) {
        if (openBtn) {
            openBtn.style.display = 'none'; // iOS não suporta scheme direto confiável
        }
        if (descEl) {
            descEl.innerHTML = 'Para instalar o app e ter acesso completo, toque no ícone de <strong>Compartilhar</strong> (ou <strong>…</strong>) e selecione <strong>"Abrir no Safari"</strong>.';
        }
    }

    if (copyBtn) {
        copyBtn.addEventListener('click', function() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentUrl).then(function() {
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Link copiado!';
                    setTimeout(function() { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar link'; }, 2500);
                });
            } else {
                const tempInput = document.createElement('input');
                tempInput.value = currentUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Link copiado!';
                setTimeout(function() { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar link'; }, 2500);
            }
        });
    }

    if (dismissBtn) {
        dismissBtn.addEventListener('click', function() {
            banner.style.display = 'none';
            sessionStorage.setItem('pwa_inapp_dismissed', 'true');
        });
    }
})();
</script>
