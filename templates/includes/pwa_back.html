<!-- Barra de Navegação de Retorno para PWA Instalado (apenas Mobile / iOS Standalone) -->
<style>
    .pwa-standalone-back-bar {
        display: none;
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9990;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 14px;
        align-items: center;
        justify-content: space-between;
    }
    .pwa-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
    }
    .pwa-back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }
    .pwa-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #94a3b8;
        font-size: 0.8rem;
        text-decoration: none;
        padding: 4px 8px;
    }
    .pwa-home-btn:hover {
        color: #ffb347;
    }
</style>

<div id="pwaStandaloneBackBar" class="pwa-standalone-back-bar">
    <button type="button" class="pwa-back-btn" id="pwaBackBtn">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>
    <a href="/pwa/start/" class="pwa-home-btn" title="Ir para o início">
        <i class="fas fa-home"></i> Início
    </a>
</div>

<script>
(function() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) {
        return;
    }

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    const path = window.location.pathname;

    const backBar = document.getElementById('pwaStandaloneBackBar');
    const backBtn = document.getElementById('pwaBackBtn');
    const desktopBackBtn = document.getElementById('pwaDesktopBackBtn');

    if (isMobile) {
        // Dispositivos Móveis (principalmente iOS onde não há botão voltar físico)
        if (backBar && path !== '/' && path !== '/pwa/start/' && path !== '/redirecionar/') {
            backBar.style.display = 'flex';
        }
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/pwa/start/';
                }
            });
        }
    } else {
        // No Desktop (Windows/Mac), nunca exibimos uma segunda barra inteira para não deixar o topo grosso
        if (backBar) {
            backBar.style.display = 'none';
        }
        // Exibimos o botão voltar elegante embutido na própria barra de navegação do site
        if (desktopBackBtn && path !== '/' && path !== '/pwa/start/' && path !== '/redirecionar/') {
            desktopBackBtn.style.display = 'inline-flex';
        }
    }
})();
</script>
