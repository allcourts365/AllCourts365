<!-- Navegação Standalone para PWA Desktop -->
<script>
(function() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) {
        return;
    }

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    const path = window.location.pathname;

    const desktopBackBtn = document.getElementById('pwaDesktopBackBtn');

    if (!isMobile) {
        // No Desktop, exibimos o botão voltar elegante integrado na barra de navegação
        if (desktopBackBtn && path !== '/' && path !== '/pwa/start/' && path !== '/redirecionar/') {
            desktopBackBtn.style.display = 'inline-flex';
        }
    }
})();
</script>
